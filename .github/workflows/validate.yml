name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repository:
    name: Repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate repository assets
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitmodules
          test -d screenshots
          test -d themes
          test -x scripts/install.sh
          test -x scripts/validate-installer.sh
          scripts/validate-installer.sh
          git config --file .gitmodules --get-regexp path

  distros:
    name: Packages (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            family: arch
            prepare: pacman -Syu --noconfirm git gawk grep sed findutils which
          - name: Debian sid
            image: debian:sid
            family: debian
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git gawk grep sed findutils
          - name: Fedora
            image: fedora:latest
            family: fedora
            prepare: dnf install -y git gawk grep sed findutils
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            family: suse
            prepare: zypper --non-interactive install git gawk grep sed findutils tar gzip
    steps:
      - name: Install base tools
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Refresh package metadata
        shell: bash
        run: |
          case "${{ matrix.family }}" in
            arch) pacman -Sy --noconfirm ;;
            debian) apt-get update ;;
            fedora) dnf makecache ;;
            suse) zypper --non-interactive refresh ;;
          esac
      - name: Detect distro family
        shell: bash
        run: |
          scripts/install.sh --dry-run | tee dry-run.log
          grep -F "(family: ${{ matrix.family }})" dry-run.log
      - name: Run installer validation
        shell: bash
        run: scripts/validate-installer.sh
      - name: Check build dependencies exist in the repositories
        shell: bash
        run: scripts/install.sh --check-packages

  build:
    name: Build (${{ matrix.name }})
    needs: distros
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm git gawk grep sed findutils which
          - name: Debian sid
            image: debian:sid
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git gawk grep sed findutils
          - name: Fedora
            image: fedora:latest
            prepare: dnf install -y git gawk grep sed findutils
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            prepare: zypper --non-interactive install git gawk grep sed findutils tar gzip
    steps:
      - name: Install base tools
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install everything (packages, submodules, builds)
        shell: bash
        run: |
          set +e
          scripts/install.sh --full-setup --yes --skip-layout --skip-discord-theme --skip-plasma-restart 2>&1 | tee install.log
          rc=${PIPESTATUS[0]}
          set -e
          # Exit 2 means some component failed; the next step decides whether that is acceptable.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Check component summary
        shell: bash
        run: |
          grep -F "Installed:" install.log
          if grep -E "^Skipped:" install.log; then
            echo "A component was skipped on this distro" >&2
            exit 1
          fi
          failed="$(sed -n 's/^Failed: *//p' install.log)"
          # Better Blur DX tracks KWin's internal API and can lag a new Plasma release.
          # Everything else must build; the installer falls back to KWin's own blur.
          if [ -n "$failed" ] && [ "$failed" != "Better Blur DX" ]; then
            echo "Unexpected component failures: $failed" >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::warning::Better Blur DX failed to build against this distro's KWin"
          fi
      - name: Check installed plugins
        shell: bash
        run: |
          patterns="*shapecorners*.so *darkly6*.so *breezeenhanced*.so"
          if ! grep -q "^Failed:.*Better Blur DX" install.log; then patterns="$patterns *better_blur_dx*.so"; fi
          for pattern in $patterns; do
            find /usr -name "${pattern}" | grep . || { echo "no plugin matching ${pattern} under /usr" >&2; exit 1; }
          done
          test -d "$HOME/.local/share/icons/WhiteSur-dark" || { echo "WhiteSur-dark icons missing" >&2; exit 1; }
