name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repository:
    name: Repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate repository assets
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitmodules
          test -d screenshots
          test -d themes
          test -x scripts/install.sh
          test -x scripts/validate-installer.sh
          scripts/validate-installer.sh
          git config --file .gitmodules --get-regexp path
